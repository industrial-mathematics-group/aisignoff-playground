name: File-signoff

# Checks with aisignoff that every file (with [history], every line) is declared,
# and publishes the file badges on pushes to the default branch. SIGNOFF.toml is set up
# with "@IMGAgent setup aisignoff"; the folder report goes on the docs site (Zensical docs workflow).
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:   # with a merge queue: checks the commit that will land
  workflow_dispatch:

permissions:
  contents: write   # pushes the badges to the "badges" branch

jobs:
  file-signoff:
    uses: industrial-mathematics-group/.github/.github/workflows/file-signoff.yml@main
    with:
      weight: lines                 # weight the badges by lines instead of files
    #   aisignoff-version: "1.0.0rc9" # another release of aisignoff than the organisation's default
