# Documentation site, built with Zensical (https://zensical.org), set up by the docs writer:
#   pip install zensical && zensical serve      # preview on http://localhost:8000
#   zensical build --clean                      # static site in site/
[project]
site_name = "aisignoff-playground"
site_description = "This is a Test"
site_url = "https://industrial-mathematics-group.github.io/aisignoff-playground/"
repo_url = "https://github.com/industrial-mathematics-group/aisignoff-playground"
repo_name = "industrial-mathematics-group/aisignoff-playground"
nav = [
  { "aisignoff-playground" = "index.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
